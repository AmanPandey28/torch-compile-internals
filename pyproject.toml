[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchcompile-lab"
version = "0.3.0"
description = "Hands-on experiments for learning torch.compile and model optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aman Pandey" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
torchcompile-lab = "compilelab.benchmark:main"
torchcompile-graph-break = "compilelab.graph_break:main"
torchcompile-codegen = "compilelab.codegen:main"

[tool.setuptools.packages.find]
include = ["compilelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
