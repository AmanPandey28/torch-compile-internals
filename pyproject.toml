[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchcompile-lab"
version = "0.6.0"
description = "Reproducible torch.compile benchmarks and compiler analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aman Pandey" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
quantization = ["torchao>=0.17,<0.18"]
llm = ["transformers>=5.11,<6", "huggingface-hub>=1,<2"]

[project.scripts]
torchcompile-lab = "compilelab.benchmark:main"
torchcompile-graph-break = "compilelab.graph_break:main"
torchcompile-codegen = "compilelab.codegen:main"
torchcompile-profile = "compilelab.profiler_trace:main"
torchcompile-dynamic-shapes = "compilelab.dynamic_shapes:main"
torchcompile-projection-packing = "compilelab.projection_packing:main"
torchcompile-transformer = "compilelab.transformer_optimization:main"
torchcompile-quantization = "compilelab.quantization:main"
torchcompile-qwen = "compilelab.qwen:main"
torchcompile-experiments = "compilelab.experiments:main"

[tool.setuptools.packages.find]
include = ["compilelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
